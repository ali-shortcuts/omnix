name: request-budget-runtime

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-budget:
    name: Provider routing + request + tool + diagnostic + image runtime acceptance
    runs-on: windows-2022
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Report tested source commit
        shell: pwsh
        run: |
          $source = (git rev-parse HEAD).Trim()
          if ($source -notmatch '^[0-9a-fA-F]{40}$') { throw "Could not resolve exact tested source commit." }
          Write-Host "OMNIX runtime-hardening source commit: $source"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure VSTO/Office PIA SDK is present
        shell: pwsh
        run: ./build/ensure-vsto-sdk.ps1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        shell: pwsh
        run: nuget restore OMNIX.sln

      - name: Build OMNIX.Core
        shell: pwsh
        run: |
          msbuild .\src\OMNIX.Core\OMNIX.Core.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll)) {
            throw "Compiled OMNIX.Core.dll is missing."
          }

      - name: Execute adaptive provider resilience acceptance
        shell: powershell
        run: |
          .\tools\provider-resilience-acceptance.ps1 `
            -CorePath .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll `
            -OutputPath .\build\artifact\provider-resilience-acceptance.json

      - name: Execute provider request budget acceptance
        shell: powershell
        run: |
          .\tools\request-budget-acceptance.ps1 `
            -CorePath .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll `
            -OutputPath .\build\artifact\request-budget-acceptance.json

      - name: Execute Office tool request-isolation acceptance
        shell: powershell
        run: |
          .\tools\tool-request-isolation-acceptance.ps1 `
            -CorePath .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll `
            -OutputPath .\build\artifact\tool-request-isolation-acceptance.json

      - name: Execute provider error redaction acceptance
        shell: powershell
        run: |
          .\tools\provider-error-redaction-acceptance.ps1 `
            -CorePath .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll `
            -OutputPath .\build\artifact\provider-error-redaction-acceptance.json

      - name: Execute image normalization acceptance
        shell: powershell
        run: |
          .\tools\image-normalization-acceptance.ps1 `
            -CorePath .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll `
            -OutputPath .\build\artifact\image-normalization-acceptance.json

      - name: Execute runtime diagnostic journal acceptance
        shell: powershell
        run: |
          .\tools\runtime-diagnostic-journal-acceptance.ps1 `
            -CorePath .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll `
            -OutputPath .\build\artifact\runtime-diagnostic-journal-acceptance.json

      - name: Validate sanitized acceptance reports
        shell: pwsh
        run: |
          $resiliencePath = '.\build\artifact\provider-resilience-acceptance.json'
          if (-not (Test-Path $resiliencePath)) { throw "Adaptive-provider resilience report is missing." }
          $resilience = Get-Content $resiliencePath -Raw | ConvertFrom-Json
          if ($resilience.TestId -ne 'PROVIDER-ADAPTIVE-RESILIENCE-RUNTIME-001') { throw "Unexpected adaptive-provider TestId." }
          if (-not [bool]$resilience.OverallPass -or [int]$resilience.FailureCount -ne 0) {
            throw "Adaptive provider resilience runtime acceptance failed."
          }

          $budgetPath = '.\build\artifact\request-budget-acceptance.json'
          if (-not (Test-Path $budgetPath)) { throw "Request-budget report is missing." }
          $budget = Get-Content $budgetPath -Raw | ConvertFrom-Json
          if ($budget.TestId -ne 'REQUEST-BUDGET-RUNTIME-001') { throw "Unexpected request-budget TestId." }
          if (-not [bool]$budget.OverallPass -or [int]$budget.FailureCount -ne 0) {
            throw "Request-budget runtime acceptance failed."
          }

          $isolationPath = '.\build\artifact\tool-request-isolation-acceptance.json'
          if (-not (Test-Path $isolationPath)) { throw "Tool request-isolation report is missing." }
          $isolation = Get-Content $isolationPath -Raw | ConvertFrom-Json
          if ($isolation.TestId -ne 'TOOL-REQUEST-ISOLATION-RUNTIME-001') { throw "Unexpected tool request-isolation TestId." }
          if (-not [bool]$isolation.OverallPass -or [int]$isolation.FailureCount -ne 0) {
            throw "Office tool request-isolation runtime acceptance failed."
          }
          if (-not [bool]$isolation.PreCancelledReadBlocked -or
              -not [bool]$isolation.InvalidScopeReadBlocked -or
              -not [bool]$isolation.CancelAfterApprovalBlockedWrite -or
              -not [bool]$isolation.ScopeLossAfterApprovalBlockedWrite -or
              -not [bool]$isolation.CancellationPropagated -or
              -not [bool]$isolation.ValidApprovedWritePass) {
            throw "One or more request/document isolation invariants failed."
          }

          $redactionPath = '.\build\artifact\provider-error-redaction-acceptance.json'
          if (-not (Test-Path $redactionPath)) { throw "Provider-error redaction report is missing." }
          $redaction = Get-Content $redactionPath -Raw | ConvertFrom-Json
          if ($redaction.TestId -ne 'PROVIDER-ERROR-REDACTION-RUNTIME-001') { throw "Unexpected provider-redaction TestId." }
          if (-not [bool]$redaction.OverallPass -or [int]$redaction.FailureCount -ne 0) {
            throw "Provider-error redaction runtime acceptance failed."
          }

          $imagePath = '.\build\artifact\image-normalization-acceptance.json'
          if (-not (Test-Path $imagePath)) { throw "Image-normalization report is missing." }
          $image = Get-Content $imagePath -Raw | ConvertFrom-Json
          if ($image.TestId -ne 'IMAGE-NORMALIZATION-RUNTIME-001') { throw "Unexpected image-normalization TestId." }
          if (-not [bool]$image.OverallPass -or [int]$image.FailureCount -ne 0) {
            throw "Image-normalization runtime acceptance failed."
          }

          $journalPath = '.\build\artifact\runtime-diagnostic-journal-acceptance.json'
          if (-not (Test-Path $journalPath)) { throw "Runtime diagnostic journal report is missing." }
          $journal = Get-Content $journalPath -Raw | ConvertFrom-Json
          if ($journal.TestId -ne 'RUNTIME-DIAGNOSTIC-JOURNAL-001') { throw "Unexpected runtime diagnostic journal TestId." }
          if (-not [bool]$journal.OverallPass -or [int]$journal.FailureCount -ne 0 -or
              -not [bool]$journal.CorrelationPass -or -not [bool]$journal.ToolTimingPass -or
              -not [bool]$journal.SecretRedactionPass -or -not [bool]$journal.NoPayloadContentPass) {
            throw "Runtime diagnostic journal acceptance failed."
          }
          Write-Host "OMNIX adaptive provider + request budget + Office tool isolation + diagnostic redaction + image normalization + runtime journal acceptance: PASS"

      - name: Upload sanitized runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: omnix-runtime-hardening-evidence
          path: |
            build/artifact/provider-resilience-acceptance.json
            build/artifact/request-budget-acceptance.json
            build/artifact/tool-request-isolation-acceptance.json
            build/artifact/provider-error-redaction-acceptance.json
            build/artifact/image-normalization-acceptance.json
            build/artifact/runtime-diagnostic-journal-acceptance.json
          if-no-files-found: error
