name: development-preview-release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Optional prerelease tag (must contain -dev, -preview, -alpha, -beta, or -rc)
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: omnix-development-preview-release
  cancel-in-progress: false

jobs:
  publish-preview:
    name: Publish verified development preview
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[publish-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Resolve source and prerelease tag
        env:
          REQUESTED_PREVIEW_TAG: ${{ inputs.tag }}
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA: $source_sha" >&2
            exit 1
          fi

          requested="$REQUESTED_PREVIEW_TAG"
          if [[ -z "$requested" ]]; then
            tag="v4.0.0-preview.${GITHUB_RUN_NUMBER}"
          else
            tag="$requested"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(dev|preview|alpha|beta|rc)[0-9A-Za-z.-]*$ ]]; then
            echo "Refusing non-prerelease tag: $tag" >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=${source_sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head CI gates
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          source_sha='${{ steps.meta.outputs.source_sha }}'
          deadline=$(( $(date +%s) + 1500 ))
          build_run=''
          contract_run=''
          runtime_run=''
          provenance_run=''

          while (( $(date +%s) < deadline )); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' \
              "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$source_sha&per_page=100")"

            build_ok="$(jq -r '[.workflow_runs[] | select(.name=="build" and .status=="completed" and .conclusion=="success")] | length' <<<"$runs")"
            contract_ok="$(jq -r '[.workflow_runs[] | select(.name=="architecture-contract" and .status=="completed" and .conclusion=="success")] | length' <<<"$runs")"
            runtime_ok="$(jq -r '[.workflow_runs[] | select(.name=="request-budget-runtime" and .status=="completed" and .conclusion=="success")] | length' <<<"$runs")"
            provenance_ok="$(jq -r '[.workflow_runs[] | select(.name=="release-provenance-contract" and .status=="completed" and .conclusion=="success")] | length' <<<"$runs")"

            failed="$(jq -r '[.workflow_runs[] | select((.name=="build" or .name=="architecture-contract" or .name=="request-budget-runtime" or .name=="release-provenance-contract") and .status=="completed" and .conclusion!="success")] | length' <<<"$runs")"
            if [[ "$failed" != "0" ]]; then
              echo "A required exact-head CI workflow failed. Refusing preview release." >&2
              jq -r '.workflow_runs[] | select(.name=="build" or .name=="architecture-contract" or .name=="request-budget-runtime" or .name=="release-provenance-contract") | "\(.name): \(.status)/\(.conclusion) run=\(.id)"' <<<"$runs"
              exit 1
            fi

            if [[ "$build_ok" != "0" && "$contract_ok" != "0" && "$runtime_ok" != "0" && "$provenance_ok" != "0" ]]; then
              build_run="$(jq -r '[.workflow_runs[] | select(.name=="build" and .status=="completed" and .conclusion=="success")] | sort_by(.created_at) | last | .id' <<<"$runs")"
              contract_run="$(jq -r '[.workflow_runs[] | select(.name=="architecture-contract" and .status=="completed" and .conclusion=="success")] | sort_by(.created_at) | last | .id' <<<"$runs")"
              runtime_run="$(jq -r '[.workflow_runs[] | select(.name=="request-budget-runtime" and .status=="completed" and .conclusion=="success")] | sort_by(.created_at) | last | .id' <<<"$runs")"
              provenance_run="$(jq -r '[.workflow_runs[] | select(.name=="release-provenance-contract" and .status=="completed" and .conclusion=="success")] | sort_by(.created_at) | last | .id' <<<"$runs")"
              break
            fi

            echo "Waiting for build + architecture-contract + request-budget-runtime + release-provenance-contract on $source_sha ..."
            sleep 20
          done

          for value in "$build_run" "$contract_run" "$runtime_run" "$provenance_run"; do
            if [[ -z "$value" || "$value" == "null" ]]; then
              echo "Timed out waiting for all exact-head CI gates." >&2
              exit 1
            fi
          done

          echo "build_run=$build_run" >> "$GITHUB_OUTPUT"
          echo "contract_run=$contract_run" >> "$GITHUB_OUTPUT"
          echo "runtime_run=$runtime_run" >> "$GITHUB_OUTPUT"
          echo "provenance_run=$provenance_run" >> "$GITHUB_OUTPUT"

      - name: Download exact build artifact
        shell: bash
        run: |
          set -euo pipefail
          build_run='${{ steps.ci.outputs.build_run }}'
          artifacts="$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$build_run/artifacts?per_page=100")"
          artifact_id="$(jq -r '.artifacts[] | select(.name=="omnix-development-build" and .expired==false) | .id' <<<"$artifacts" | head -n1)"
          if [[ -z "$artifact_id" || "$artifact_id" == "null" ]]; then
            echo "omnix-development-build artifact is missing or expired." >&2
            exit 1
          fi

          mkdir -p release-input
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > release-input/artifact.zip
          unzip -q release-input/artifact.zip -d release-input/unpacked

      - name: Download and verify exact runtime-hardening evidence
        id: runtime_evidence
        shell: bash
        run: |
          set -euo pipefail
          source_sha='${{ steps.meta.outputs.source_sha }}'
          runtime_run='${{ steps.ci.outputs.runtime_run }}'
          artifacts="$(gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$runtime_run/artifacts?per_page=100")"
          runtime_artifact_id="$(jq -r '.artifacts[] | select(.name=="omnix-runtime-hardening-evidence" and .expired==false) | .id' <<<"$artifacts" | head -n1)"
          if [[ -z "$runtime_artifact_id" || "$runtime_artifact_id" == "null" ]]; then
            echo "omnix-runtime-hardening-evidence artifact is missing or expired." >&2
            exit 1
          fi

          mkdir -p release-input/runtime-unpacked
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts/$runtime_artifact_id/zip" > release-input/runtime-artifact.zip
          unzip -q release-input/runtime-artifact.zip -d release-input/runtime-unpacked

          bash ./build/package-runtime-release-evidence.sh \
            release-input/runtime-unpacked \
            release-input \
            "$source_sha" \
            "$runtime_run" | tee release-input/runtime-evidence-packager.log

          runtime_zip_sha="$(awk '{print $1}' release-input/OMNIX-runtime-hardening-evidence.sha256)"
          [[ "$runtime_zip_sha" =~ ^[0-9a-f]{64}$ ]] || { echo 'Invalid runtime evidence ZIP checksum.' >&2; exit 1; }
          jq -e \
            --arg source "$source_sha" \
            --argjson runtimeRun "$runtime_run" \
            '.SourceCommit == $source and
             .RuntimeWorkflow.RunId == $runtimeRun and
             .OverallPass == true and
             ([.Reports[].TestId] | index("TOOL-REQUEST-ISOLATION-RUNTIME-001")) != null' \
            release-input/runtime-evidence-index.json >/dev/null

          echo "runtime_artifact_id=$runtime_artifact_id" >> "$GITHUB_OUTPUT"
          echo "runtime_zip_sha256=$runtime_zip_sha" >> "$GITHUB_OUTPUT"
          echo "runtime_zip_size=$(stat -c%s release-input/OMNIX-runtime-hardening-evidence.zip)" >> "$GITHUB_OUTPUT"

      - name: Verify development-only artifact contract
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          root='release-input/unpacked'
          manifest="$(find "$root" -type f -path '*/build/artifact/manifest.json' -print -quit)"
          installer="$(find "$root" -type f -name 'OMNIX-Setup-*.exe' -print -quit)"
          checksum="$(find "$root" -type f -path '*/build/artifact/installer.sha256' -print -quit)"
          if [[ -z "$manifest" || -z "$installer" || -z "$checksum" ]]; then
            echo "Required release files are missing from the build artifact." >&2
            exit 1
          fi

          source_sha='${{ steps.meta.outputs.source_sha }}'
          [[ "$(jq -r '.ArtifactType' "$manifest")" == 'DEVELOPMENT_ONLY' ]] || { echo 'ArtifactType is not DEVELOPMENT_ONLY.' >&2; exit 1; }
          [[ "$(jq -r '.SourceCommit' "$manifest")" == "$source_sha" ]] || { echo 'Artifact SourceCommit mismatch.' >&2; exit 1; }
          [[ "$(jq -r '.RequiredOfficePayloadPresent' "$manifest")" == 'true' ]] || { echo 'Required Office payload was not proven.' >&2; exit 1; }
          [[ "$(jq -r '.PrivacyGatewayRuntimePass' "$manifest")" == 'true' ]] || { echo 'Privacy runtime gate did not pass.' >&2; exit 1; }
          [[ "$(jq -r '.EncryptedHistoryRuntimePass' "$manifest")" == 'true' ]] || { echo 'Encrypted history runtime gate did not pass.' >&2; exit 1; }
          [[ "$(jq -r '.LegacyHistoryMigrationPass' "$manifest")" == 'true' ]] || { echo 'Legacy history migration runtime gate did not pass.' >&2; exit 1; }
          [[ "$(jq -r '.HistoryPlaintextAbsentOnDisk' "$manifest")" == 'true' ]] || { echo 'History plaintext absence was not proven.' >&2; exit 1; }
          [[ "$(jq -r '.OfficeMaintenanceAuditPass' "$manifest")" == 'true' ]] || { echo 'Office maintenance audit did not pass.' >&2; exit 1; }
          [[ "$(jq -r '.ProductionReleaseApproved' "$manifest")" == 'false' ]] || { echo 'Unexpected production approval state.' >&2; exit 1; }
          [[ "$(jq -r '.RealOfficeRuntimeTested' "$manifest")" == 'false' ]] || { echo 'This workflow only publishes CI development artifacts.' >&2; exit 1; }

          expected="$(tr -d '\r\n ' < "$checksum" | tr '[:upper:]' '[:lower:]')"
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          manifest_hash="$(jq -r '.Sha256' "$manifest" | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual" != "$expected" || "$actual" != "$manifest_hash" ]]; then
            echo "Installer SHA256 does not match manifest/checksum evidence." >&2
            exit 1
          fi

          cp "$installer" release-input/OMNIX-AI-OFFICE-Setup-DEV.exe
          cp "$manifest" release-input/manifest.json
          printf '%s  %s\n' "$actual" 'OMNIX-AI-OFFICE-Setup-DEV.exe' > release-input/OMNIX-AI-OFFICE-Setup-DEV.sha256

          echo "installer_sha=$actual" >> "$GITHUB_OUTPUT"
          echo "installer_size=$(stat -c%s release-input/OMNIX-AI-OFFICE-Setup-DEV.exe)" >> "$GITHUB_OUTPUT"

      - name: Build exact source ZIP for this release
        id: sourcepkg
        shell: bash
        run: |
          set -euo pipefail
          source_sha='${{ steps.meta.outputs.source_sha }}'
          short_sha='${{ steps.meta.outputs.short_sha }}'
          package_root="release-input/source-package/OMNIX-${short_sha}"
          mkdir -p "$package_root"

          # Extract only files tracked by the exact tested source commit. Build outputs, secrets,
          # local packages and .git internals cannot leak into this archive.
          git archive --format=tar "$source_sha" | tar -xf - -C "$package_root"
          printf '%s\n' "$source_sha" > "$package_root/SOURCE-COMMIT.txt"

          (cd release-input/source-package && zip -q -r ../OMNIX-complete-source.zip "OMNIX-${short_sha}")
          source_hash="$(sha256sum release-input/OMNIX-complete-source.zip | awk '{print $1}')"
          printf '%s  %s\n' "$source_hash" 'OMNIX-complete-source.zip' > release-input/OMNIX-complete-source.sha256

          # Verify the commit marker survived packaging before publication.
          unzip -p release-input/OMNIX-complete-source.zip "OMNIX-${short_sha}/SOURCE-COMMIT.txt" | tr -d '\r\n' | grep -Fx "$source_sha"
          echo "source_sha256=$source_hash" >> "$GITHUB_OUTPUT"
          echo "source_size=$(stat -c%s release-input/OMNIX-complete-source.zip)" >> "$GITHUB_OUTPUT"

      - name: Write exact-head CI provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          source_sha='${{ steps.meta.outputs.source_sha }}'
          build_run='${{ steps.ci.outputs.build_run }}'
          contract_run='${{ steps.ci.outputs.contract_run }}'
          runtime_run='${{ steps.ci.outputs.runtime_run }}'
          provenance_run='${{ steps.ci.outputs.provenance_run }}'

          jq -n \
            --arg source "$source_sha" \
            --argjson buildRun "$build_run" \
            --argjson contractRun "$contract_run" \
            --argjson runtimeRun "$runtime_run" \
            --argjson provenanceRun "$provenance_run" \
            --argjson releaseRun "$GITHUB_RUN_ID" \
            '{
              EvidenceType:"OMNIX_DEVELOPMENT_PREVIEW_CI_PROVENANCE",
              EvidenceSchema:1,
              SourceCommit:$source,
              RequiredExactHeadWorkflows:{
                Build:{Name:"build",RunId:$buildRun,Conclusion:"success"},
                ArchitectureContract:{Name:"architecture-contract",RunId:$contractRun,Conclusion:"success"},
                RuntimeHardening:{Name:"request-budget-runtime",RunId:$runtimeRun,Conclusion:"success"},
                ReleaseProvenance:{Name:"release-provenance-contract",RunId:$provenanceRun,Conclusion:"success"}
              },
              ReleaseWorkflow:{Name:"development-preview-release",RunId:$releaseRun},
              AllRequiredSucceeded:true
            }' > release-input/ci-provenance.json

          jq -e --arg source "$source_sha" \
            '.SourceCommit == $source and .AllRequiredSucceeded == true and (.RequiredExactHeadWorkflows | length) == 4' \
            release-input/ci-provenance.json >/dev/null
          provenance_sha="$(sha256sum release-input/ci-provenance.json | awk '{print $1}')"
          printf '%s  %s\n' "$provenance_sha" 'ci-provenance.json' > release-input/ci-provenance.sha256
          echo "provenance_sha256=$provenance_sha" >> "$GITHUB_OUTPUT"

      - name: Write explicit preview release notes
        shell: bash
        run: |
          cat > release-input/RELEASE-NOTES.md <<'EOF'
          # OMNIX Unified Development Preview — privacy, installer, runtime evidence and source integrity

          This prerelease is tied to one exact source commit. The attached installer, manifest,
          complete-source ZIP, runtime-hardening evidence bundle and CI provenance record are all
          derived from or explicitly bound to that same source commit and include SHA-256 evidence.

          Fixes and hardening in this generation:
          - chat history is DPAPI-protected for the current Windows user before persistence
          - legacy plaintext history JSON is migrated to encrypted storage and removed only after a successful encrypted write
          - raw Office screenshot/image bytes remain request-scoped and are not persisted in chat history
          - corrupt encrypted history fails closed instead of being interpreted as plaintext
          - prerequisites complete before an existing installation is changed; failures/restarts stop the upgrade
          - installation refuses while Office is open and checks .NET Framework 4.8
          - failed post-install verification returns exit code 10, including in silent mode
          - manual model IDs are preserved and late provider responses cannot replace another provider's model list
          - Test Connection checks an actual selected-model text response with the configured privacy policy
          - Excel, Word and PowerPoint VSTO registration uses the canonical Microsoft Office host path
          - automatic load is configured with `LoadBehavior=3`
          - installer and maintenance scanner use the same canonical registration model

          Proven by CI for this exact source commit:
          - architecture / anti-drift contract PASS
          - request-budget, Office tool request-isolation, provider-error-redaction and image-normalization runtime acceptance PASS
          - sanitized runtime-hardening evidence bundle attached, including exact runtime workflow Run ID and per-report SHA-256 values
          - release-provenance packager/contract acceptance PASS
          - C#/WPF/VSTO solution build PASS
          - Excel, Word and PowerPoint VSTO payload packaged
          - deterministic Privacy Gate runtime acceptance PASS
          - encrypted-history round-trip / no-plaintext / legacy-migration / corrupt-ciphertext acceptance PASS
          - Office-less installer preflight preserves existing installation data
          - automatic Office registration maintenance audit PASS in read-only mode
          - installer compiled and checksum-bound to the attached manifest
          - complete source ZIP generated directly from the exact tested commit
          - CI provenance record binds all required workflow Run IDs to the exact source commit

          Not yet proven by GitHub-hosted CI:
          - real interactive Excel + Word + PowerPoint automatic-load / Ribbon / task-pane E2E
          - Windows restart persistence
          - live provider matrix on a consumer machine
          - offline local-model E2E with public Internet disconnected
          - consumer Defender + SmartScreen with normal protections enabled
          - trusted timestamped production Authenticode signing

          The production release gate remains fail-closed until those real-machine requirements are satisfied.
          EOF

      - name: Publish GitHub prerelease
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.meta.outputs.tag }}'
          source_sha='${{ steps.meta.outputs.source_sha }}'
          gh release create "$tag" \
            release-input/OMNIX-AI-OFFICE-Setup-DEV.exe \
            release-input/OMNIX-AI-OFFICE-Setup-DEV.sha256 \
            release-input/OMNIX-complete-source.zip \
            release-input/OMNIX-complete-source.sha256 \
            release-input/OMNIX-runtime-hardening-evidence.zip \
            release-input/OMNIX-runtime-hardening-evidence.sha256 \
            release-input/runtime-evidence-index.json \
            release-input/ci-provenance.json \
            release-input/ci-provenance.sha256 \
            release-input/manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$source_sha" \
            --title "OMNIX Unified Development Preview ${{ steps.meta.outputs.short_sha }}" \
            --notes-file release-input/RELEASE-NOTES.md \
            --prerelease

      - name: Remove superseded preview 62 and 63 after verified publication
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.meta.outputs.tag }}'
          # This is a deliberately scoped user-requested cleanup, not blanket branch/release deletion.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,tagName > published-release.json
          jq -e --arg tag "$tag" '.tagName == $tag and (.assets | any(.name == "OMNIX-AI-OFFICE-Setup-DEV.exe" and .size > 0)) and (.assets | any(.name == "OMNIX-complete-source.zip" and .size > 0)) and (.assets | any(.name == "ci-provenance.json" and .size > 0))' published-release.json >/dev/null
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease > existing-releases.json
          for old_tag in v4.0.0-preview.62 v4.0.0-preview.63; do
            if [[ "$old_tag" != "$tag" ]] && jq -e --arg old "$old_tag" 'any(.tagName == $old and .isPrerelease)' existing-releases.json >/dev/null; then
              gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
          done

      - name: Report published preview
        shell: bash
        run: |
          echo "Published prerelease: ${{ steps.meta.outputs.tag }}"
          echo "Source: ${{ steps.meta.outputs.source_sha }}"
          echo "Installer SHA256: ${{ steps.artifact.outputs.installer_sha }}"
          echo "Installer size: ${{ steps.artifact.outputs.installer_size }} bytes"
          echo "Source ZIP SHA256: ${{ steps.sourcepkg.outputs.source_sha256 }}"
          echo "Source ZIP size: ${{ steps.sourcepkg.outputs.source_size }} bytes"
          echo "Runtime workflow run: ${{ steps.ci.outputs.runtime_run }}"
          echo "Runtime evidence ZIP SHA256: ${{ steps.runtime_evidence.outputs.runtime_zip_sha256 }}"
          echo "Runtime evidence ZIP size: ${{ steps.runtime_evidence.outputs.runtime_zip_size }} bytes"
          echo "CI provenance SHA256: ${{ steps.provenance.outputs.provenance_sha256 }}"
