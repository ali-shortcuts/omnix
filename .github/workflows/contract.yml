name: architecture-contract

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: OMNIX anti-drift contract
    runs-on: windows-2022
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          # github.sha is a synthetic merge commit for pull_request events. The release gate
          # requires evidence for the actual OMNIX branch head, so test that exact head here.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Report tested source commit
        shell: pwsh
        run: |
          $source = (git rev-parse HEAD).Trim()
          if ($source -notmatch '^[0-9a-fA-F]{40}$') { throw "Could not resolve exact tested source commit." }
          Write-Host "OMNIX contract source commit: $source"

      - name: Enforce PowerShell automatic variable safety
        shell: pwsh
        run: ./build/powershell-automatic-variable-contract.ps1

      - name: Enforce OMNIX architecture and safety contract
        shell: pwsh
        run: ./build/contract-gates.ps1

      - name: Enforce real-evidence release contract
        shell: pwsh
        run: ./build/real-evidence-contract-gates.ps1

      - name: Enforce final Office AI and lifecycle evidence contract
        shell: pwsh
        run: ./build/final-evidence-contract-gates.ps1

      - name: Enforce final task-pane production evidence contract
        shell: pwsh
        run: ./build/final-taskpane-contract-gates.ps1

      - name: Execute final task-pane guard behavior acceptance
        shell: powershell
        run: ./tools/final-taskpane-guard-acceptance.ps1

      - name: Enforce exact-build real evidence binding contract
        shell: pwsh
        run: ./build/final-evidence-binding-contract-gates.ps1

      - name: Enforce Windows PowerShell evidence parser and encoding contract
        shell: powershell
        run: ./build/windows-powershell-evidence-contract.ps1

      - name: Enforce interactive real-machine preflight safety contract
        shell: pwsh
        run: ./build/real-machine-preflight-contract-gates.ps1

      - name: Execute coherent bound Office evidence validator acceptance
        shell: powershell
        run: ./tools/bound-office-evidence-validator-acceptance.ps1

      - name: Execute installed payload identity tamper acceptance
        shell: powershell
        run: ./tools/payload-identity-binding-acceptance.ps1

      - name: Execute final evidence binding guard behavior acceptance
        shell: powershell
        run: ./tools/final-evidence-binding-guard-acceptance.ps1

      - name: Enforce consumer protection release contract
        shell: pwsh
        run: ./build/consumer-security-contract-gates.ps1

      - name: Enforce runtime hardening contract
        shell: pwsh
        run: ./build/runtime-hardening-contract-gates.ps1

      - name: Enforce adaptive provider engine contract
        shell: pwsh
        run: ./build/adaptive-provider-contract-gates.ps1

      - name: Enforce conversation continuity contract
        shell: pwsh
        run: ./build/conversation-continuity-contract-gates.ps1

      - name: Enforce Office search retrieval contract
        shell: pwsh
        run: ./build/search-retrieval-contract-gates.ps1

      - name: Enforce provider diagnostic privacy contract
        shell: pwsh
        run: ./build/diagnostic-redaction-contract-gates.ps1

      - name: Enforce image input and capture safety contract
        shell: pwsh
        run: ./build/image-safety-contract-gates.ps1

      - name: Enforce automatic Office registration maintenance contract
        shell: pwsh
        run: ./build/office-maintenance-contract-gates.ps1

      - name: Enforce canonical production evidence runbook contract
        shell: pwsh
        run: ./build/production-runbook-contract-gates.ps1
