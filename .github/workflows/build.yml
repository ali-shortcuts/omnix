# OMNIX v3 CI
#
# This workflow builds and packages a DEVELOPMENT installer. It intentionally does NOT publish
# GitHub Releases. A public release requires real Office/UI/provider evidence plus a trusted
# production Authenticode signature; GitHub-hosted runners cannot prove those conditions.
name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION: OMNIX.sln
  CONFIGURATION: Release

jobs:
  build:
    name: Build + package (windows-2022)
    runs-on: windows-2022

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact tested source commit
        id: source
        shell: pwsh
        run: |
          $source = (git rev-parse HEAD).Trim()
          if ($source -notmatch '^[0-9a-fA-F]{40}$') { throw "Could not resolve exact tested source commit." }
          "sha=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "OMNIX build source commit: $source"

      - name: Temporarily exclude workspace from Defender during VSTO compilation
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Write-Host "Temporary build exclusion added. It will be removed before the installer scan."
          } catch {
            Write-Host "Could not add temporary Defender exclusion (non-fatal): $_"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-prerelease: false

      - name: Ensure VSTO SDK is present
        shell: pwsh
        run: ./build/ensure-vsto-sdk.ps1

      - name: Create non-exportable DEVELOPMENT manifest-signing certificate
        id: cert
        shell: pwsh
        run: |
          ./build/create-signing-cert.ps1
          if (Test-Path build/cert/OMNIX.pfx) { throw "Private signing key file must never exist in CI/release payload." }
          $thumb = (Get-Content build/cert/thumbprint.txt -Raw).Trim()
          if (-not $thumb) { throw "Development certificate thumbprint is empty." }
          "thumbprint=$thumb" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Development manifest signer ready. Private key remains in CurrentUser certificate store."

      - name: NuGet restore
        shell: pwsh
        run: |
          if (-not (Test-Path build/nuget.exe)) {
            $ProgressPreference = 'SilentlyContinue'
            Invoke-WebRequest 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile build/nuget.exe
          }
          ./build/nuget.exe restore $env:SOLUTION

      - name: Build solution with signed VSTO manifests
        shell: pwsh
        run: ./build/build-with-fallbacks.ps1 ${{ steps.cert.outputs.thumbprint }}

      - name: Execute compiled WPF workspace startup regression
        shell: powershell
        run: ./build/workspace-startup-acceptance.ps1

      - name: Runtime AI Gateway privacy acceptance
        shell: powershell
        run: |
          .\tools\privacy-acceptance.ps1 `
            -CorePath .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll `
            -OutputPath .\build\artifact\privacy-acceptance.json

      - name: Runtime encrypted chat-history acceptance
        shell: powershell
        run: |
          .\tools\history-storage-acceptance.ps1 `
            -CorePath .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll `
            -OutputPath .\build\artifact\history-storage-acceptance.json

      - name: Runtime provider diagnostics acceptance
        shell: powershell
        run: |
          .\tools\provider-diagnostics-acceptance.ps1 `
            -CorePath .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll `
            -OutputPath .\build\artifact\provider-diagnostics-acceptance.json

      - name: Stage installer payload and enforce complete Office payload
        shell: pwsh
        run: ./build/package.ps1

      - name: Verify staged payload before installer compilation
        shell: pwsh
        run: |
          $required = @(
            'OMNIX.Excel.dll','OMNIX.Excel.dll.manifest','OMNIX.Excel.vsto',
            'OMNIX.Word.dll','OMNIX.Word.dll.manifest','OMNIX.Word.vsto',
            'OMNIX.PowerPoint.dll','OMNIX.PowerPoint.dll.manifest','OMNIX.PowerPoint.vsto',
            'OMNIX.Core.dll','office-registration-maintenance.ps1','install-maintenance-task.ps1'
          )
          foreach ($name in $required) {
            $path = Join-Path 'installer\payload' $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "HOLLOW_INSTALLER_GUARD: $name is missing before Inno Setup compilation." }
            if ((Get-Item -LiteralPath $path).Length -le 0) { throw "HOLLOW_INSTALLER_GUARD: $name is empty before Inno Setup compilation." }
          }
          if (-not (Test-Path build\artifact\payload-inventory.json)) { throw "Payload inventory was not generated." }
          $inventory = @(Get-Content build\artifact\payload-inventory.json -Raw | ConvertFrom-Json)
          if ($inventory.Count -lt 12) { throw "Payload inventory is unexpectedly small ($($inventory.Count) entries)." }
          Write-Host "Complete OMNIX Office payload verified: $($inventory.Count) inventoried files."

      - name: Audit automatic Office registration maintenance on hosted runner
        shell: powershell
        run: |
          .\installer\payload\office-registration-maintenance.ps1 `
            -InstallDir .\installer\payload `
            -OutputPath .\build\artifact\office-registration-maintenance-audit.json `
            -AuditOnly
          $report = Get-Content .\build\artifact\office-registration-maintenance-audit.json -Raw | ConvertFrom-Json
          if ($report.TestId -ne 'OFFICE-REGISTRATION-MAINTENANCE-002' -or -not [bool]$report.OverallPass) {
            throw 'Office registration maintenance audit did not PASS.'
          }
          Write-Host "Office maintenance audit PASS. Installed hosts observed on runner: $($report.InstalledHostCount). No registration writes were requested."

      - name: Bundle official Microsoft VSTO Runtime redistributable
        shell: pwsh
        run: |
          $dest = "installer\payload\vstor_redist.exe"
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest `
            -Uri "https://download.microsoft.com/download/8/6/4/8641e164-7796-4b34-81c7-30d24a5bd533/vstor_redist.exe" `
            -OutFile $dest `
            -UseBasicParsing `
            -TimeoutSec 180
          $size = (Get-Item $dest).Length
          if ($size -lt 10000000) { throw "vstor_redist.exe is unexpectedly small ($size bytes)." }
          $signature = Get-AuthenticodeSignature -LiteralPath $dest
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'Microsoft VSTO Runtime signature could not be verified.'
          }
          Write-Host "Bundled Microsoft VSTO Runtime: $size bytes; verified Microsoft signature"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Execute actual installer prerequisite decision regressions
        shell: powershell
        run: ./build/runtime-policy-acceptance.ps1

      - name: Verify setup helper execution under Restricted policy
        shell: powershell
        run: ./build/setup-powershell-acceptance.ps1

      - name: Compile development single-exe installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found." }
          New-Item -ItemType Directory -Force build\artifact | Out-Null
          $ver = "0.0.0-dev"
          $compilerOutput = & $iscc "/DMyAppVersion=$ver" "installer/installer.iss" 2>&1
          $compileExit = $LASTEXITCODE
          $compilerOutput | Tee-Object -FilePath build\artifact\inno-compile.log | Write-Host
          if ($compileExit -ne 0) { exit $compileExit }

          $exe = Get-ChildItem installer\Output\OMNIX-Setup-*.exe | Select-Object -First 1
          if (-not $exe -or $exe.Length -lt 1MB) { throw "Installer output missing or unexpectedly small." }
          $compileText = Get-Content build\artifact\inno-compile.log -Raw
          foreach ($requiredFile in @('OMNIX.Excel.dll','OMNIX.Word.dll','OMNIX.PowerPoint.dll','OMNIX.Core.dll','office-registration-maintenance.ps1','install-maintenance-task.ps1')) {
            if ($compileText -notmatch [Regex]::Escape($requiredFile)) { throw "HOLLOW_INSTALLER_GUARD: Inno compile log does not contain $requiredFile." }
          }
          Write-Host "Development installer compiled with Office hosts + maintenance payload: $($exe.Name) ($($exe.Length) bytes)"

      - name: Verify installer handles Office-less CI machine gracefully
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\Output\OMNIX-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "No installer exe found." }

          $log = Join-Path $PWD "install_test.log"
          $probeInstallDir = Join-Path $env:RUNNER_TEMP 'omnix-preserved-install'
          New-Item -ItemType Directory -Force $probeInstallDir | Out-Null
          $marker = Join-Path $probeInstallDir 'existing-install-marker.txt'
          $markerText = [Guid]::NewGuid().ToString('N')
          Set-Content -LiteralPath $marker -Value $markerText -NoNewline
          $p = Start-Process -FilePath $exe.FullName `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/LOG=$log","/NORESTART","/DIR=$probeInstallDir" `
            -Wait -PassThru

          if ($p.ExitCode -eq 0) {
            $installDir = $probeInstallDir
            if (-not (Test-Path (Join-Path $installDir 'OMNIX.Core.dll'))) { throw "Installer returned success but OMNIX.Core.dll was not installed." }
            Write-Host "Installer completed successfully on this runner."
            exit 0
          }

          $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          $expectedOfficeLess =
            ($text -match 'Microsoft Office .* was not detected') -or
            ($text -match 'No supported (desktop )?Excel, Word or PowerPoint installation was (found|detected)')
          if ($expectedOfficeLess) {
            if (-not (Test-Path -LiteralPath $marker) -or (Get-Content -LiteralPath $marker -Raw) -ne $markerText) {
              throw "Preflight failure damaged the existing installation marker."
            }
            if (Test-Path (Join-Path $probeInstallDir 'OMNIX.Core.dll')) {
              throw "Preflight failure unexpectedly installed Office payload."
            }
            Write-Host "Expected: GitHub-hosted runner has no supported Office host. Installer refused cleanly instead of crashing."
            Write-Host "Existing install marker preserved and no new Office payload written."
            exit 0
          }
          Write-Host $text
          throw "Installer failed for an unexpected reason (exit $($p.ExitCode))."

      - name: Remove temporary Defender exclusion
        if: always()
        shell: pwsh
        run: |
          try {
            Remove-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Write-Host "Temporary Defender build exclusion removed."
          } catch {
            Write-Host "Could not remove exclusion (it may never have been added): $_"
          }

      - name: Windows Defender custom scan after exclusion removal
        shell: pwsh
        run: ./build/defender-check.ps1

      - name: Generate development artifact manifest
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\Output\OMNIX-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "Installer missing before artifact manifest generation." }

          $source = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($source -notmatch '^[0-9a-f]{40}$') { throw "Invalid source commit in artifact evidence." }
          if ($source -ne '${{ steps.source.outputs.sha }}'.ToLowerInvariant()) { throw "Source commit changed during the build." }

          $inventoryPath = 'build\artifact\payload-inventory.json'
          if (-not (Test-Path $inventoryPath)) { throw "Payload inventory missing from artifact evidence." }
          $inventoryHash = (Get-FileHash -Algorithm SHA256 $inventoryPath).Hash.ToLowerInvariant()

          $privacyPath = 'build\artifact\privacy-acceptance.json'
          if (-not (Test-Path $privacyPath)) { throw "Privacy runtime acceptance evidence is missing." }
          $privacy = Get-Content $privacyPath -Raw | ConvertFrom-Json
          if ($privacy.TestId -ne 'PRIVACY-GATE-RUNTIME-001' -or -not [bool]$privacy.OverallPass) { throw "Privacy runtime acceptance did not PASS." }

          $historyPath = 'build\artifact\history-storage-acceptance.json'
          if (-not (Test-Path $historyPath)) { throw "Encrypted history runtime acceptance evidence is missing." }
          $history = Get-Content $historyPath -Raw | ConvertFrom-Json
          if ($history.TestId -ne 'HISTORY-STORAGE-RUNTIME-001' -or -not [bool]$history.OverallPass) { throw "Encrypted history runtime acceptance did not PASS." }

          $maintenancePath = 'build\artifact\office-registration-maintenance-audit.json'
          if (-not (Test-Path $maintenancePath)) { throw "Office maintenance audit evidence is missing." }
          $maintenance = Get-Content $maintenancePath -Raw | ConvertFrom-Json
          if ($maintenance.TestId -ne 'OFFICE-REGISTRATION-MAINTENANCE-002' -or -not [bool]$maintenance.OverallPass -or -not [bool]$maintenance.AuditOnly) {
            throw "Office maintenance audit did not PASS in AuditOnly mode."
          }

          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $sig = Get-AuthenticodeSignature $exe.FullName
          $defenderReport = 'build\defender-report.txt'
          $defenderText = if (Test-Path $defenderReport) { Get-Content $defenderReport -Raw } else { '' }
          $rtp = $null
          if ($defenderText -match 'RealTimeProtectionEnabled:\s*True') { $rtp = $true }
          elseif ($defenderText -match 'RealTimeProtectionEnabled:\s*False') { $rtp = $false }

          $manifest = [ordered]@{
            ArtifactType = 'DEVELOPMENT_ONLY'
            SourceCommit = $source
            FileName = $exe.Name
            SizeBytes = [int64]$exe.Length
            Sha256 = $hash
            PayloadInventorySha256 = $inventoryHash
            RequiredOfficePayloadPresent = $true
            PrivacyGatewayRuntimeTested = $true
            PrivacyGatewayRuntimePass = [bool]$privacy.OverallPass
            EncryptedHistoryRuntimeTested = $true
            EncryptedHistoryRuntimePass = [bool]$history.OverallPass
            LegacyHistoryMigrationPass = [bool]$history.LegacyMigrationPass
            HistoryPlaintextAbsentOnDisk = [bool]$history.PlaintextAbsentOnDisk
            OfficeMaintenanceAuditTested = $true
            OfficeMaintenanceAuditPass = [bool]$maintenance.OverallPass
            OfficeMaintenanceAuditOnly = [bool]$maintenance.AuditOnly
            AuthenticodeStatus = [string]$sig.Status
            DefenderCustomScanCompleted = [bool](Test-Path $defenderReport)
            DefenderRealTimeProtectionEnabled = $rtp
            RealOfficeRuntimeTested = $false
            ProductionReleaseApproved = $false
            Note = 'CI development artifact only. Deterministic privacy, encrypted-history and maintenance audit logic are tested, but real Office/UI/provider/consumer-machine security verification and trusted production signing remain mandatory.'
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content build\artifact\manifest.json -Encoding UTF8
          $hash | Set-Content build\artifact\installer.sha256 -Encoding ASCII
          $manifest | ConvertTo-Json -Depth 6

      - name: Upload development build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnix-development-build
          path: |
            installer/Output/*.exe
            build/artifact/manifest.json
            build/artifact/installer.sha256
            build/artifact/payload-inventory.json
            build/artifact/privacy-acceptance.json
            build/artifact/history-storage-acceptance.json
            build/artifact/office-registration-maintenance-audit.json
            build/artifact/runtime-policy-acceptance.json
            build/artifact/setup-powershell-acceptance.json
            build/artifact/workspace-startup-acceptance.json
            build/artifact/inno-compile.log
            build/defender-report.txt
            build/logs/*.binlog
          if-no-files-found: error

# No automatic GitHub Release step belongs in this workflow.
# Release only after tools/release-readiness.ps1 returns OverallPass=true for the exact installer
# and a trusted production Authenticode signing path is in place.
