name: office-search-retrieval-runtime

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-retrieval:
    name: Office search retrieval runtime acceptance
    runs-on: windows-2022
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Report tested source commit
        shell: pwsh
        run: |
          $source = (git rev-parse HEAD).Trim()
          if ($source -notmatch '^[0-9a-fA-F]{40}$') { throw "Could not resolve exact tested source commit." }
          Write-Host "OMNIX Office-search source commit: $source"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure VSTO/Office PIA SDK is present
        shell: pwsh
        run: ./build/ensure-vsto-sdk.ps1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        shell: pwsh
        run: nuget restore OMNIX.sln

      - name: Build OMNIX.Core
        shell: pwsh
        run: |
          msbuild .\src\OMNIX.Core\OMNIX.Core.csproj /m /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll)) {
            throw "Compiled OMNIX.Core.dll is missing."
          }

      - name: Execute Office search retrieval acceptance
        shell: powershell
        run: |
          .\tools\search-document-acceptance.ps1 `
            -CorePath .\src\OMNIX.Core\bin\Release\OMNIX.Core.dll `
            -OutputPath .\build\artifact\search-document-acceptance.json

      - name: Validate sanitized search evidence
        shell: pwsh
        run: |
          $path = '.\build\artifact\search-document-acceptance.json'
          if (-not (Test-Path $path)) { throw "Office-search acceptance report is missing." }
          $report = Get-Content $path -Raw | ConvertFrom-Json
          if ($report.TestId -ne 'OFFICE-SEARCH-RETRIEVAL-RUNTIME-001') { throw "Unexpected Office-search TestId." }
          if (-not [bool]$report.OverallPass -or [int]$report.FailureCount -ne 0) {
            throw "Office-search retrieval runtime acceptance failed."
          }
          foreach ($name in @(
              'WhitelistedPass','ReadOnlyPass','QueryForwardedPass','ResultCountClampedPass',
              'ResultCharCapPass','UntrustedWrapperPass','FenceNeutralizedPass',
              'EmptyQueryRejectedPass','OversizedQueryRejectedPass','CancellationBeforeSearchPass',
              'ScopeLossBeforeSearchPass','NoWritePathPass')) {
            if (-not [bool]$report.$name) { throw "Office-search invariant failed: $name" }
          }
          Write-Host "OMNIX Office search retrieval runtime acceptance: PASS"

      - name: Upload sanitized search evidence
        uses: actions/upload-artifact@v4
        with:
          name: omnix-office-search-retrieval-evidence
          path: build/artifact/search-document-acceptance.json
          if-no-files-found: error
